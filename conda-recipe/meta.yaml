package:
  name: q2-longitudinal
  version: {{ PLUGIN_VERSION }}
source:
  path: ..
build:
  script: make install
requirements:
  host:
  - python {{ python }}
  - setuptools
  - versioningit
  - wheel
  run:
  - python {{ python }}
  - numpy {{ numpy }}
  - pandas {{ pandas }}
  - scipy {{ scipy }}
  - statsmodels {{ statsmodels }}
  - patsy {{ patsy }}
  - scikit-bio {{ scikit_bio }}
  - seaborn {{ seaborn }}
  - qiime2 >={{ qiime2 }}
  - q2-types >={{ q2_types }}
  - q2-sample-classifier >={{ q2_sample_classifier }}
  - q2templates >={{ q2templates }}
  - q2-feature-table >={{ q2_feature_table }}
  - matplotlib {{ matplotlib }}
  build:
  - python {{ python }}
  - setuptools
  - versioningit
test:
  requires:
  - qiime2 >={{ qiime2 }}
  - q2-types >={{ q2_types }}
  - q2-sample-classifier >={{ q2_sample_classifier }}
  - q2templates >={{ q2templates }}
  - q2-feature-table >={{ q2_feature_table }}
  - selenium
  - pytest
  imports:
  - q2_longitudinal
  - qiime2.plugins.longitudinal
  commands:
  - py.test --pyargs q2_longitudinal
about:
  home: https://qiime2.org
  license: BSD-3-Clause
  license_family: BSD
